openapi: 3.0.3
info:
  title: Judgy - Hackathon Project Analysis API
  description: |
    AI-powered hackathon project evaluation platform.
    
    ## Scoring System
    - Code Agent (60%): Analyzes GitHub repository code
    - Market Agent (40%): Researches market potential via web search
    - Total Score = (code_score × 0.6) + (market_score × 0.4)
    
    ## Evaluation Response Format
    Each agent returns JSON:
    ```json
    {
      "score": 0-100,
      "summary": "...",
      "strengths": [...],
      "weaknesses": [...],
      "criterion_scores": {"Criterion": 75, ...}
    }
    ```
    
    ## Background Processing
    Market and Code analysis run asynchronously after project creation.
    Results may take 30-60 seconds to appear.
  version: 1.0.0

servers:
  - url: http://localhost:8000/api
    description: Local development server

tags:
  - name: Hackathons
    description: Hackathon management
  - name: Projects
    description: Project submission and management
  - name: Scoring
    description: Project scoring and leaderboard

paths:
  /create-hackathon:
    post:
      tags:
        - Hackathons
      summary: Create a new hackathon
      operationId: createHackathon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "AI Hackathon 2024"
                theme:
                  type: string
                  example: "AI/ML Projects"
                criteria:
                  type: string
                  description: Comma-separated criteria for evaluation
                  example: "Code Quality, Innovation, Tech Stack, Market Potential"
      responses:
        '200':
          description: Hackathon created
          content:
            application/json:
              example:
                message: "Hackathon created"
                hackathon_id: 1

  /create-project:
    post:
      tags:
        - Projects
      summary: Submit a new project
      description: Triggers async code and market analysis
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shortDescription:
                  type: string
                  example: "My AI Project"
                longDescription:
                  type: string
                githubLink:
                  type: string
                  format: uri
                  example: "https://github.com/user/repo"
                hackathonId:
                  type: integer
                  description: Optional hackathon ID
      responses:
        '200':
          description: Project created
          content:
            application/json:
              example:
                message: "Project created"
                project_id: "uuid-here"

  /get-hackathon/{id}:
    get:
      tags:
        - Hackathons
      summary: Get hackathon details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Hackathon details

  /get-all-hackathons:
    get:
      tags:
        - Hackathons
      summary: List all hackathons
      responses:
        '200':
          description: List of hackathons

  /get-project/{project_id}:
    get:
      tags:
        - Projects
      summary: Get project with scores
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project details with evaluations
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_id:
                    type: string
                  short_description:
                    type: string
                  code_score:
                    type: number
                  market_score:
                    type: number
                  total_score:
                    type: number
                  code_evaluation:
                    type: object
                    description: Full code agent JSON response
                  market_evaluation:
                    type: object
                    description: Full market agent JSON response

  /get-project-score/{project_id}:
    get:
      tags:
        - Scoring
      summary: Get project score breakdown
      description: Returns code_score (60%), market_score (40%), and total_score
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Score breakdown
          content:
            application/json:
              example:
                message: "successful"
                project_id: "uuid"
                code_score: 75
                market_score: 68
                total_score: 72.2
                code_evaluation:
                  score: 75
                  summary: "Good code quality"
                  strengths: ["Clean architecture"]
                  weaknesses: ["No tests"]
                market_evaluation:
                  score: 68
                  summary: "Strong market potential"

  /get-hackathon-projects/{hackathon_id}:
    get:
      tags:
        - Projects
      summary: List projects in a hackathon
      parameters:
        - name: hackathon_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of projects

  /get-hackathon-leaderboard/{hackathon_id}:
    get:
      tags:
        - Scoring
      summary: Get hackathon leaderboard
      description: Ranked projects by total score (60% code + 40% market)
      parameters:
        - name: hackathon_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Ranked projects
          content:
            application/json:
              example:
                message: "successful"
                leaderboard:
                  - project_id: "uuid"
                    short_description: "Project A"
                    code_score: 80
                    market_score: 75
                    total_score: 78

  /get-all:
    get:
      tags:
        - Projects
      summary: Get all projects
      responses:
        '200':
          description: List of all projects

  /search:
    post:
      tags:
        - Search
      summary: Semantic search projects
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
      responses:
        '200':
          description: Search results

  /review:
    post:
      tags:
        - Review
      summary: Mark project as reviewed
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id:
                  type: string
                isReviewed:
                  type: boolean
      responses:
        '200':
          description: Review updated

components:
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        error:
          type: string